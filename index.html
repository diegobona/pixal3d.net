<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Pixal3D MVP: an AI 3D model generation workspace powered by TencentARC Pixal3D on Hugging Face Spaces."
    />
    <title>Pixal3D AI 3D Model Generator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" aria-label="Pixal3D workspace header">
        <div class="brand-block">
          <h1>Pixal3D</h1>
          <p class="tagline">AI 3D Model Generator</p>
        </div>

        <div class="actions" aria-label="Workspace actions">
          <span class="status-dot" aria-label="Embedded Hugging Face Space"></span>
        </div>
      </header>

      <main class="workspace">
        <iframe
          class="space-frame"
          src="https://tencentarc-pixal3d.hf.space"
          title="Pixal3D Hugging Face Space for AI 3D model generation"
          allow="accelerometer; ambient-light-sensor; camera; clipboard-read; clipboard-write; encrypted-media; fullscreen; geolocation; gyroscope; microphone; midi; payment; usb; web-share; xr-spatial-tracking"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </main>
    </div>

    <noscript>
      <p>
        JavaScript is required by the embedded Pixal3D Space. Open
        <a href="https://huggingface.co/spaces/TencentARC/Pixal3D">TencentARC/Pixal3D</a>
        directly.
      </p>
    </noscript>
  </body>
</html>
