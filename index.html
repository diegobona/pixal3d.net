<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Generate 3D model assets with Pixal3D, an AI-powered workspace for exploring 3D creation, visual prototyping, and creative production."
    />
    <title>Pixal3D AI 3D Model Generator</title>
    <meta property="og:title" content="Pixal3D AI 3D Model Generator" />
    <meta
      property="og:description"
      content="Generate 3D model assets with Pixal3D, an AI-powered workspace for exploring 3D creation, visual prototyping, and creative production."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:description"
      content="Generate 3D model assets with Pixal3D, an AI-powered workspace for exploring 3D creation, visual prototyping, and creative production."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#111827" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" aria-label="Pixal3D workspace header">
        <div class="brand-block">
          <img class="brand-logo" src="./favicon.svg" alt="Pixal3D logo" />
          <div class="brand-copy">
            <h1>Pixal3D Image to 3D Generator</h1>
            <p class="tagline">Turn Any Image into a Realistic 3D Model</p>
          </div>
        </div>

      </header>

      <main class="workspace">
        <section class="api-studio" aria-label="Pixal3D API generator">
          <form class="control-panel" id="pixal3d-form">
            <label class="upload-zone" for="image-input">
              <input id="image-input" name="image" type="file" accept="image/*" required />
              <span class="upload-kicker">Source Image</span>
              <strong>Upload an image</strong>
              <span>PNG, JPG, or WebP works best</span>
            </label>

            <div class="settings-grid">
              <label>
                Seed
                <input id="seed-input" name="seed" type="number" value="42" min="0" step="1" />
              </label>

              <label>
                Resolution
                <select id="resolution-input" name="resolution">
                  <option value="512">512 Fast test</option>
                  <option value="1024">1024 Balanced</option>
                  <option value="1536" selected>1536 High quality</option>
                </select>
              </label>
            </div>

            <button class="primary-action" type="submit">Generate 3D Model</button>
            <a class="secondary-action" href="https://tencentarc-pixal3d.hf.space" target="_blank" rel="noreferrer">
              Open Full Generator
            </a>

            <p class="api-status" id="api-status" role="status">
              Upload an image to call the public Pixal3D Gradio API.
            </p>
          </form>

          <section class="result-panel" aria-label="Generation result">
            <div class="preview-frame">
              <img id="preview-image" alt="" hidden />
              <p id="preview-empty">Your generated asset status will appear here.</p>
            </div>

            <div class="result-actions">
              <a class="download-link" id="download-link" href="#" target="_blank" rel="noreferrer" hidden>
                Download GLB
              </a>
              <pre id="api-output" aria-label="API response"></pre>
            </div>
          </section>
        </section>
      </main>
    </div>

    <noscript>
      <p>
        JavaScript is required to load the Pixal3D AI 3D model generation workspace.
      </p>
    </noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
